# Các bước deploy MỘT môi trường; deploy.yml gọi cho staging, production và khi chạy tay.
# Biến (vars) và secret khai báo riêng trong từng GitHub Environment — danh sách ở deploy/secrets.conf.
name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      release:
        type: string
        required: true
      skip_migrate:
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.site.outputs.url }}
    permissions:
      contents: read
      packages: read
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      RELEASE: ${{ inputs.release }}
      TARGET: deploy@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release }}

      # Dừng ngay, nêu tên từng key thiếu hoặc sai, trước khi chạm vào máy chủ.
      - name: Kiểm tra đủ secret và variable (deploy/secrets.conf)
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: deploy/secrets.sh preflight "$ENVIRONMENT"

      - name: Địa chỉ công khai (suy ra từ SITE_DOMAIN trong deploy.env)
        id: site
        run: echo "url=https://$(sed -n 's/^SITE_DOMAIN=//p' "deploy/env/$ENVIRONMENT/deploy.env")" >> "$GITHUB_OUTPUT"

      - name: Khóa SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Chép file deploy và cấu hình của môi trường
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          rsync -az --delete --exclude env/ deploy/ "$TARGET:/opt/dacn/"
          { cat "deploy/env/$ENVIRONMENT/deploy.env"; echo "APP_ENV=$ENVIRONMENT"; echo "IMAGE_REPO=ghcr.io/${OWNER,,}/dacn"; } > /tmp/deploy.env
          scp /tmp/deploy.env "deploy/env/$ENVIRONMENT/app.env" "deploy/env/$ENVIRONMENT/web.env" \
            "deploy/env/$ENVIRONMENT/alloy.env" "$TARGET:/etc/dacn/"

      - name: Ghi secret thành file trên máy chủ (danh sách ở deploy/secrets.conf)
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: deploy/secrets.sh upload "$ENVIRONMENT"

      - name: Đăng nhập GHCR trên máy chủ (token tự hết hạn khi job kết thúc)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029  # cố ý: tên user mở rộng ở runner
          printf '%s' "$GHCR_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '$ACTOR' --password-stdin"

      - name: Deploy
        env:
          SKIP_MIGRATE: ${{ inputs.skip_migrate && '--skip-migrate' || '' }}
        run: |
          # shellcheck disable=SC2029  # cố ý: tham số mở rộng ở runner
          ssh "$TARGET" "/opt/dacn/deploy.sh '$RELEASE' $SKIP_MIGRATE"

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Smoke test (chỉ đọc, an toàn cho production)
        working-directory: frontend
        env:
          PUBLIC_URL: ${{ steps.site.outputs.url }}
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$PUBLIC_URL/api/v1/health/ready"
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL="$PUBLIC_URL" npx playwright test e2e/smoke.spec.ts --project=desktop

      - name: Đăng xuất GHCR
        if: always()
        run: ssh "$TARGET" "docker logout ghcr.io" || true
