# Sau khi CI trên main thành công: build image → staging → (duyệt tay) → production (docs mục 11.5).
# Chạy tay (workflow_dispatch) để deploy lại hoặc rollback một bản đã build.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      release:
        description: Git SHA đầy đủ của bản đã build (rollback hoặc deploy lại)
        type: string
        required: true
      skip_migrate:
        description: Bỏ qua migration (đúng khi rollback)
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      release: ${{ steps.vars.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: vars
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "release=$SHA" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPO=ghcr.io/${OWNER,,}/dacn" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          target: runtime
          push: true
          tags: ${{ env.IMAGE_REPO }}-backend:${{ steps.vars.outputs.release }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Image frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: runtime
          push: true
          build-args: RELEASE=${{ steps.vars.outputs.release }}
          tags: ${{ env.IMAGE_REPO }}-frontend:${{ steps.vars.outputs.release }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Quét lỗ hổng image backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPO }}-backend:${{ steps.vars.outputs.release }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Quét lỗ hổng image frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPO }}-frontend:${{ steps.vars.outputs.release }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  staging:
    needs: build
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      release: ${{ needs.build.outputs.release }}
    secrets: inherit

  production:   # môi trường "production" trên GitHub đặt Required reviewers → bước duyệt tay
    needs: [build, staging]
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      release: ${{ needs.build.outputs.release }}
    secrets: inherit

  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: ${{ inputs.environment }}
      release: ${{ inputs.release }}
      skip_migrate: ${{ inputs.skip_migrate }}
    secrets: inherit
