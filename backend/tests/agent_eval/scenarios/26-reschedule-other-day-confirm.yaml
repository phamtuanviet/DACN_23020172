title: Dời lịch sang ngày khác, chọn giờ rồi xác nhận; mã lịch giữ nguyên (UC10, AC-12)
category: doi
appointments:
  - {key: lan_mon, patient: lan, doctor: derm_minh, service: derm, start: "2026-10-12T08:00:00+07:00"}
turns:
  - user: Tôi muốn dời lịch khám da liễu thứ Hai tuần sau sang sáng thứ Tư tuần sau
