title: Kể triệu chứng ngoài da thì không chẩn đoán, chỉ nêu dịch vụ khớp từ khóa (AC-14, FR-AGT-06)
category: trieu-chung
turns:
  - user: Da tay tôi bị ngứa và nổi mẩn đỏ mấy hôm nay, tôi bị làm sao vậy?
