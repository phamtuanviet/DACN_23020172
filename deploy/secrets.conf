# Secret và variable của mỗi GitHub Environment (staging, production). Đây là danh sách DUY NHẤT:
#   - workflow deploy đọc để kiểm tra đủ giá trị trước khi deploy, rồi ghi secret lên máy chủ;
#   - `make secrets`, `make secret` đọc để xem, nhập, đổi giá trị (deploy/secrets.sh);
#   - CI đối chiếu với compose.prod.yaml và chặn tên secret lọt vào deploy/env/*.env.
# Thêm secret mới: thêm một dòng ở đây, khai báo trong compose.prod.yaml (mục secrets và service dùng nó),
# rồi thêm trường cùng tên viết thường trong backend/app/core/config.py nếu backend đọc nó.
#
# LOẠI      secret: mã hóa, không đọc lại được | var: variable, không mã hóa, hiện trong log
# BẮT BUỘC  all | production: chỉ bắt buộc ở production | optional: thiếu thì chỉ cảnh báo
# ĐÍCH      runner: chỉ workflow dùng | file: /etc/dacn/secrets/<tên viết thường> | valkey: sinh valkey_url, valkey_conf
# KIỂU      cách nhập và cách kiểm tra giá trị (hàm check_value và obtain trong deploy/secrets.sh)
#
# TÊN                  LOẠI    BẮT BUỘC    ĐÍCH    KIỂU         MÔ TẢ
DEPLOY_HOST            var     all         runner  host         IP hoặc tên máy chủ; workflow SSH vào bằng user deploy
SSH_KNOWN_HOSTS        var     all         runner  known-hosts  Khóa host của máy chủ (ssh-keyscan), chống giả mạo máy chủ
SSH_PRIVATE_KEY        secret  all         runner  ssh-key      Khóa ed25519 chỉ dùng cho CI, ứng với ~deploy/.ssh/authorized_keys
DATABASE_URL           secret  all         file    pg-url       postgresql+psycopg://app_runtime:<mật khẩu>@<host>:5432/dacn?sslmode=verify-full
DATABASE_MIGRATOR_URL  secret  all         file    pg-url       Như DATABASE_URL, với role app_migrator (chỉ bước migrate dùng)
JWT_KEYS               secret  all         file    jwt          Khóa ký JWT dạng kid:secret
VALKEY_PASSWORD        secret  all         valkey  password     Mật khẩu Valkey
ORIGIN_CERT            secret  all         file    pem-cert     Chứng chỉ Cloudflare Origin CA
ORIGIN_KEY             secret  all         file    pem-key      Khóa riêng của chứng chỉ origin
SENTRY_DSN             secret  production  file    url          DSN Sentry; staging có thể bỏ trống
SMTP_USER              secret  production  file    text         Tài khoản SMTP của Amazon SES; thiếu thì không gửi được email
SMTP_PASSWORD          secret  production  file    text         Mật khẩu SMTP của Amazon SES
LLM_API_KEY            secret  optional    file    text         Khóa API LLM; thiếu thì Agent trả 503, phần còn lại vẫn chạy
GRAFANA_CLOUD_TOKEN    secret  optional    file    text         Token Grafana Cloud; thiếu thì không đẩy log và metrics
